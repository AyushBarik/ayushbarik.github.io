  <style>
    /* Basic styling for blog preview items - you can move this to styles.css */
    .blog-post-preview {
      margin-bottom: 30px; /* Space between blog post previews */
      padding-bottom: 20px; /* Space before the line if the line is outside */
      /* border-bottom: 1px solid #eee; */ /* Alternative to <hr> if you prefer border */
    }
    .blog-post-preview h2 a {
      text-decoration: none;
      color: #333; /* Or your preferred link color */
    }
    .blog-post-preview h2 a:hover {
      text-decoration: underline;
      color: #007bff; /* Or your preferred link hover color */
    }
    .blog-post-preview .date {
      color: #777;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .blog-post-preview .snippet {
      color: #555;
      line-height: 1.6;
    }
    hr.blog-separator {
      border: 0;
      height: 1px;
      background-color: #ccc; /* Color of the thin line */
      margin-top: 15px;    /* Space above the line */
      margin-bottom: 25px; /* Space below the line */
    }
